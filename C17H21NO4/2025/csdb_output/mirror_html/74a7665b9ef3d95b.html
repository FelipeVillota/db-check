,"uri":null}],"transcript":"C'est un coup de filet d'envergure qui a eu lieu au port d'Anvers contre un r\u00e9seau de trafic de drogue o\u00f9 les autorit\u00e9s belges ont intercept\u00e9 une cargaison massive de plusieurs tonnes de r\u00e9sine de cannabis et de coca\u00efne en provenance du Maroc dissimul\u00e9 \u00e0 l'int\u00e9rieur d'un conteneur commercial. Une enqu\u00eate est ouverte pour identifier les ramifications de ce r\u00e9seau tentaculaire dont les racines semblent remonter au Maroc. Ces affaires l\u00e8vent le voile sur la strat\u00e9gie des cartels visant \u00e0 instrumentaliser la logistique maritime et les couloirs commerciaux pour exporter leur substance toxique alors que la justice belge engage les proc\u00e9dures de destruction de la marchandise, l'alerte est maximale en Europe face \u00e0 cette menace marocaine r\u00e9currente le renforcement de la coop\u00e9ration s\u00e9curitaire et l'\u00e9change de renseignements deviennent une urgence absolue pour ass\u00e9cher les sources de ce fl\u00e9au au-del\u00e0 de la saisie ce dossier br\u00fblant interpelle la communaut\u00e9 internationale face \u00e0 un narcotrafic qui menace directement la et la sant\u00e9 publique, l'action collective reste la seule arme pour neutraliser d\u00e9finitivement ses r\u00e9seaux et couper la route au baron de la drogue."},"video_home_www_top_trending_tv_movies_videos_section":{"section_components":{"nodes":[]},"section_header":{"message":{"text":"M\u00e1s videos"},"see_all_deeplink_uri":null},"id":"dmg6NzcyMTkxNTIwNjM5OTI2OjE1MzQ0NzMwNzgzMDk4ODA="},"video_home_www_rhc_movie_trailers_section":null},"extensions":{"prefetch_uris_v2":[{"uri":"https:\/\/scontent.fbog3-3.fna.fbcdn.net\/v\/t15.5256-10\/491694922_656941587048364_794854864677419683_n.jpg?stp=dst-jpg_tt6&cstp=mx1920x1080&ctp=s960x960&_nc_cat=106&_nc_map=urlgen_bucketless&ccb=1-7&_nc_sid=c44d43&_nc_ohc=sjMR4FwZxG8Q7kNvwEWnQor&_nc_oc=AdoZ4KnBRbrVLffqZw9NlyjdeFNiKw-Y7ms20oakxUWkj_QwhxEuFatPNcG10sGvPWg&_nc_zt
